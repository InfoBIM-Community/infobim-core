[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "infobim"
authors = [
    { name = "Elias Magalhães", email = "elias@brasidata.com" }
]
version = "0.10.0"
description = "InfoBIM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ontobdc>=0.21.0",
    "ontobdc-view>=0.8.0",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
    "PyYAML>=6.0",
    "textual-datepicker>=0.2.4",
]

[project.scripts]
infobim = "infobim.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["infobim*"]

[tool.setuptools.package-data]
infobim = [
    "context/ontology/*.ttl",
    "view/plugin/asset/js/*.js",
    "view/plugin/asset/image/*",
    "**/*.yaml",
    "i18n/locale/*.yaml",
]
