statechart:
  name: DxfLine
  description: "Interactive freehand trace capture over a DXF view."

  root state:
    name: dxf_line
    initial: undefined

    states:
      - name: undefined
        transitions:
          - target: dxf_loaded
            guard: handler.can_transit_to(to_state = DxfLineProcessState.DXF_LOADED)
            action: handler.perform_state_transition(to_state = DxfLineProcessState.DXF_LOADED)
            contract:
              - after: handler.validate_state_transition(from_state = DxfLineProcessState.UNDEFINED, to_state = DxfLineProcessState.DXF_LOADED)

      - name: dxf_loaded
        transitions:
          - target: line_captured
            guard: handler.can_transit_to(to_state = DxfLineProcessState.LINE_CAPTURED)
            action: handler.perform_state_transition(to_state = DxfLineProcessState.LINE_CAPTURED)
            contract:
              - after: handler.validate_state_transition(from_state = DxfLineProcessState.DXF_LOADED, to_state = DxfLineProcessState.LINE_CAPTURED)

      - name: line_captured
        transitions:
          - target: trace_ready
            guard: handler.can_transit_to(to_state = DxfLineProcessState.TRACE_READY)
            action: handler.perform_state_transition(to_state = DxfLineProcessState.TRACE_READY)
            contract:
              - after: handler.validate_state_transition(from_state = DxfLineProcessState.LINE_CAPTURED, to_state = DxfLineProcessState.TRACE_READY)

      - name: trace_ready
        type: final
