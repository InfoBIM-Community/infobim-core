statechart:
  name: ElementCreationFromVector
  description: "Resolve the element kind and its representation."

  root state:
    name: element_creation_from_vector
    initial: undefined

    states:
      - name: undefined
        transitions:
          - target: element_kind_resolved
            guard: handler.can_transit_to(to_state = DxfVectorProcessState.ELEMENT_KIND_RESOLVED)
            action: handler.perform_state_transition(to_state = DxfVectorProcessState.ELEMENT_KIND_RESOLVED)
            contract:
              - after: handler.validate_state_transition(from_state = DxfVectorProcessState.UNDEFINED, to_state = DxfVectorProcessState.ELEMENT_KIND_RESOLVED)

      - name: element_kind_resolved
        transitions:
          - target: element_representation_resolved
            guard: handler.can_transit_to(to_state = DxfVectorProcessState.ELEMENT_REPRESENTATION_RESOLVED)
            action: handler.perform_state_transition(to_state = DxfVectorProcessState.ELEMENT_REPRESENTATION_RESOLVED)
            contract:
              - after: handler.validate_state_transition(from_state = DxfVectorProcessState.ELEMENT_KIND_RESOLVED, to_state = DxfVectorProcessState.ELEMENT_REPRESENTATION_RESOLVED)

      - name: element_representation_resolved
        transitions:
          - target: work_plane_confirmed
            guard: handler.can_transit_to(to_state = DxfVectorProcessState.WORK_PLANE_CONFIRMED)
            action: handler.perform_state_transition(to_state = DxfVectorProcessState.WORK_PLANE_CONFIRMED)
            contract:
              - after: handler.validate_state_transition(from_state = DxfVectorProcessState.ELEMENT_REPRESENTATION_RESOLVED, to_state = DxfVectorProcessState.WORK_PLANE_CONFIRMED)

      - name: work_plane_confirmed
        transitions:
          - target: dxf_loaded
            guard: handler.can_transit_to(to_state = DxfVectorProcessState.DXF_LOADED)
            action: handler.perform_state_transition(to_state = DxfVectorProcessState.DXF_LOADED)
            contract:
              - after: handler.validate_state_transition(from_state = DxfVectorProcessState.WORK_PLANE_CONFIRMED, to_state = DxfVectorProcessState.DXF_LOADED)

      - name: dxf_loaded
        transitions:
          - target: vector_captured
            guard: handler.can_transit_to(to_state = DxfVectorProcessState.VECTOR_CAPTURED)
            action: handler.perform_state_transition(to_state = DxfVectorProcessState.VECTOR_CAPTURED)
            contract:
              - after: handler.validate_state_transition(from_state = DxfVectorProcessState.DXF_LOADED, to_state = DxfVectorProcessState.VECTOR_CAPTURED)

      - name: vector_captured
        transitions:
          - target: pipe_radius_defined
            guard: handler.can_transit_to(to_state = DxfVectorProcessState.PIPE_RADIUS_DEFINED)
            action: handler.perform_state_transition(to_state = DxfVectorProcessState.PIPE_RADIUS_DEFINED)
            contract:
              - after: handler.validate_state_transition(from_state = DxfVectorProcessState.VECTOR_CAPTURED, to_state = DxfVectorProcessState.PIPE_RADIUS_DEFINED)

      - name: pipe_radius_defined
        transitions:
          - target: ifc_element_created
            guard: handler.can_transit_to(to_state = DxfVectorProcessState.IFC_ELEMENT_CREATED)
            action: handler.perform_state_transition(to_state = DxfVectorProcessState.IFC_ELEMENT_CREATED)
            contract:
              - after: handler.validate_state_transition(from_state = DxfVectorProcessState.PIPE_RADIUS_DEFINED, to_state = DxfVectorProcessState.IFC_ELEMENT_CREATED)

      - name: ifc_element_created
        transitions:
          - target: trace_ready
            guard: handler.can_transit_to(to_state = DxfVectorProcessState.TRACE_READY)
            action: handler.perform_state_transition(to_state = DxfVectorProcessState.TRACE_READY)
            contract:
              - after: handler.validate_state_transition(from_state = DxfVectorProcessState.IFC_ELEMENT_CREATED, to_state = DxfVectorProcessState.TRACE_READY)

      - name: trace_ready
        type: final
