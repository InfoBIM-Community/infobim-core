statechart:
  name: StandardIfcElementMove
  description: "Statechart for moving an existing InfoBIM IFC element along one axis."

  root state:
    name: standard_ifc_element_move
    initial: undefined

    states:
      - name: undefined
        label:
          en: "Undefined"
          pt-br: "Indefinido"
        description:
          en: "Initial state, before the target IFC model was verified."
          pt-br: "Estado inicial, antes da verificacao do modelo IFC alvo."
        transitions:
          - target: ifc_model_healthy
            guard: handler.can_transit_to(to_state = IfcElementMoveProcessStatePort.IFC_MODEL_HEALTHY)
            action: handler.perform_state_transition(to_state = IfcElementMoveProcessStatePort.IFC_MODEL_HEALTHY)
            contract:
              - after: handler.validate_state_transition(from_state = IfcElementMoveProcessStatePort.UNDEFINED, to_state = IfcElementMoveProcessStatePort.IFC_MODEL_HEALTHY)

      - name: ifc_model_healthy
        label:
          en: "IFC Model Healthy"
          pt-br: "Modelo IFC Saudavel"
        description:
          en: "The target IFC model was resolved and can be modified."
          pt-br: "O modelo IFC alvo foi resolvido e pode ser modificado."
        transitions:
          - target: element_located
            guard: handler.can_transit_to(to_state = IfcElementMoveProcessStatePort.ELEMENT_LOCATED)
            action: handler.perform_state_transition(to_state = IfcElementMoveProcessStatePort.ELEMENT_LOCATED)
            contract:
              - after: handler.validate_state_transition(from_state = IfcElementMoveProcessStatePort.IFC_MODEL_HEALTHY, to_state = IfcElementMoveProcessStatePort.ELEMENT_LOCATED)

      - name: element_located
        label:
          en: "Element Located"
          pt-br: "Elemento Localizado"
        description:
          en: "The element this run moves carries the identity the project's own rule gives it, confirmed in the target model."
          pt-br: "O elemento movido por esta execucao carrega a identidade dada pela regra do proprio projeto, confirmada no modelo alvo."
        transitions:
          - target: displacement_defined
            guard: handler.can_transit_to(to_state = IfcElementMoveProcessStatePort.DISPLACEMENT_DEFINED)
            action: handler.perform_state_transition(to_state = IfcElementMoveProcessStatePort.DISPLACEMENT_DEFINED)
            contract:
              - after: handler.validate_state_transition(from_state = IfcElementMoveProcessStatePort.ELEMENT_LOCATED, to_state = IfcElementMoveProcessStatePort.DISPLACEMENT_DEFINED)

      - name: displacement_defined
        label:
          en: "Displacement Defined"
          pt-br: "Deslocamento Definido"
        description:
          en: "The vector this run moves the element by is defined."
          pt-br: "O vetor pelo qual esta execucao move o elemento esta definido."
        transitions:
          - target: element_moved
            guard: handler.can_transit_to(to_state = IfcElementMoveProcessStatePort.ELEMENT_MOVED)
            action: handler.perform_state_transition(to_state = IfcElementMoveProcessStatePort.ELEMENT_MOVED)
            contract:
              - after: handler.validate_state_transition(from_state = IfcElementMoveProcessStatePort.DISPLACEMENT_DEFINED, to_state = IfcElementMoveProcessStatePort.ELEMENT_MOVED)

      - name: element_moved
        label:
          en: "Element Moved"
          pt-br: "Elemento Movido"
        description:
          en: "The project's IFC model carries the element at its new position."
          pt-br: "O modelo IFC do projeto carrega o elemento na sua nova posicao."
        type: final
