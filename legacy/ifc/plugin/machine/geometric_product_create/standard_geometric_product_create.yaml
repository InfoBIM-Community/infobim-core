statechart:
  name: StandardGeometricProductCreate
  description: "Statechart for creating a geometric product in an InfoBIM project's IFC model."

  root state:
    name: standard_geometric_product_create
    initial: undefined

    states:
      - name: undefined
        label:
          en: "Undefined"
          pt-br: "Indefinido"
        description:
          en: "Initial state, before the target IFC model was verified."
          pt-br: "Estado inicial, antes da verificacao do modelo IFC alvo."
        transitions:
          - target: ifc_model_healthy
            guard: handler.can_transit_to(to_state = GeometricProductCreateProcessStatePort.IFC_MODEL_HEALTHY)
            action: handler.perform_state_transition(to_state = GeometricProductCreateProcessStatePort.IFC_MODEL_HEALTHY)
            contract:
              - after: handler.validate_state_transition(from_state = GeometricProductCreateProcessStatePort.UNDEFINED, to_state = GeometricProductCreateProcessStatePort.IFC_MODEL_HEALTHY)

      - name: ifc_model_healthy
        label:
          en: "IFC Model Healthy"
          pt-br: "Modelo IFC Saudavel"
        description:
          en: "The target IFC model was resolved or created and can be modified."
          pt-br: "O modelo IFC alvo foi resolvido ou criado e pode ser modificado."
        transitions:
          - target: unit_defined
            guard: handler.can_transit_to(to_state = GeometricProductCreateProcessStatePort.UNIT_DEFINED)
            action: handler.perform_state_transition(to_state = GeometricProductCreateProcessStatePort.UNIT_DEFINED)
            contract:
              - after: handler.validate_state_transition(from_state = GeometricProductCreateProcessStatePort.IFC_MODEL_HEALTHY, to_state = GeometricProductCreateProcessStatePort.UNIT_DEFINED)

      - name: unit_defined
        label:
          en: "Unit Defined"
          pt-br: "Unidade Definida"
        description:
          en: "The target IFC model states the unit context geometry is measured in."
          pt-br: "O modelo IFC alvo declara o contexto de unidades da geometria."
        transitions:
          - target: position_defined
            guard: handler.can_transit_to(to_state = GeometricProductCreateProcessStatePort.POSITION_DEFINED)
            action: handler.perform_state_transition(to_state = GeometricProductCreateProcessStatePort.POSITION_DEFINED)
            contract:
              - after: handler.validate_state_transition(from_state = GeometricProductCreateProcessStatePort.UNIT_DEFINED, to_state = GeometricProductCreateProcessStatePort.POSITION_DEFINED)

      - name: position_defined
        label:
          en: "Position Defined"
          pt-br: "Posicao Definida"
        description:
          en: "The position the geometric operation requires is defined for this run."
          pt-br: "A posicao exigida pela operacao geometrica esta definida nesta execucao."
        transitions:
          - target: geometry_defined
            guard: handler.can_transit_to(to_state = GeometricProductCreateProcessStatePort.GEOMETRY_DEFINED)
            action: handler.perform_state_transition(to_state = GeometricProductCreateProcessStatePort.GEOMETRY_DEFINED)
            contract:
              - after: handler.validate_state_transition(from_state = GeometricProductCreateProcessStatePort.POSITION_DEFINED, to_state = GeometricProductCreateProcessStatePort.GEOMETRY_DEFINED)

      - name: geometry_defined
        label:
          en: "Geometry Defined"
          pt-br: "Geometria Definida"
        description:
          en: "The primitive geometry is completely defined by its own command."
          pt-br: "A geometria primitiva esta completamente definida pelo seu comando."
        transitions:
          - target: geometry_created
            guard: handler.can_transit_to(to_state = GeometricProductCreateProcessStatePort.GEOMETRY_CREATED)
            action: handler.perform_state_transition(to_state = GeometricProductCreateProcessStatePort.GEOMETRY_CREATED)
            contract:
              - after: handler.validate_state_transition(from_state = GeometricProductCreateProcessStatePort.GEOMETRY_DEFINED, to_state = GeometricProductCreateProcessStatePort.GEOMETRY_CREATED)

      - name: geometry_created
        label:
          en: "Geometry Created"
          pt-br: "Geometria Criada"
        description:
          en: "The corresponding IFC geometry exists in the target IFC model."
          pt-br: "A geometria IFC correspondente existe no modelo IFC alvo."
        transitions:
          - target: shape_representation_created
            guard: handler.can_transit_to(to_state = GeometricProductCreateProcessStatePort.SHAPE_REPRESENTATION_CREATED)
            action: handler.perform_state_transition(to_state = GeometricProductCreateProcessStatePort.SHAPE_REPRESENTATION_CREATED)
            contract:
              - after: handler.validate_state_transition(from_state = GeometricProductCreateProcessStatePort.GEOMETRY_CREATED, to_state = GeometricProductCreateProcessStatePort.SHAPE_REPRESENTATION_CREATED)

      - name: shape_representation_created
        label:
          en: "Shape Representation Created"
          pt-br: "Representacao de Forma Criada"
        description:
          en: "The IFC shape representation of the created geometry exists."
          pt-br: "A representacao de forma IFC da geometria criada existe."
        transitions:
          - target: geometric_product_created
            guard: handler.can_transit_to(to_state = GeometricProductCreateProcessStatePort.GEOMETRIC_PRODUCT_CREATED)
            action: handler.perform_state_transition(to_state = GeometricProductCreateProcessStatePort.GEOMETRIC_PRODUCT_CREATED)
            contract:
              - after: handler.validate_state_transition(from_state = GeometricProductCreateProcessStatePort.SHAPE_REPRESENTATION_CREATED, to_state = GeometricProductCreateProcessStatePort.GEOMETRIC_PRODUCT_CREATED)

      - name: geometric_product_created
        label:
          en: "Geometric Product Created"
          pt-br: "Produto Geometrico Criado"
        description:
          en: "The IFC element the title names exists and carries the created representation."
          pt-br: "O elemento IFC nomeado pelo titulo existe e carrega a representacao criada."
        transitions:
          - target: geometric_product_federated
            guard: handler.can_transit_to(to_state = GeometricProductCreateProcessStatePort.GEOMETRIC_PRODUCT_FEDERATED)
            action: handler.perform_state_transition(to_state = GeometricProductCreateProcessStatePort.GEOMETRIC_PRODUCT_FEDERATED)
            contract:
              - after: handler.validate_state_transition(from_state = GeometricProductCreateProcessStatePort.GEOMETRIC_PRODUCT_CREATED, to_state = GeometricProductCreateProcessStatePort.GEOMETRIC_PRODUCT_FEDERATED)

      - name: geometric_product_federated
        label:
          en: "Geometric Product Federated"
          pt-br: "Produto Geometrico Federado"
        description:
          en: "The project's IFC model carries the product, placed in its spatial structure. States beyond this one are specified before being added."
          pt-br: "O modelo IFC do projeto carrega o produto, colocado em sua estrutura espacial. Estados alem deste sao especificados antes de serem adicionados."
        type: final
