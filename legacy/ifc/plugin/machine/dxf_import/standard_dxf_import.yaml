statechart:
  name: IfcDxfImport
  description: "Prepare a DXF source for import as an IFC representation kind."

  root state:
    name: ifc_dxf_import
    initial: undefined

    states:
      - name: undefined
        transitions:
          - target: dxf_source_ready
            guard: handler.can_transit_to(to_state = IfcImportProcessState.DXF_SOURCE_READY)
            action: handler.perform_state_transition(to_state = IfcImportProcessState.DXF_SOURCE_READY)
            contract:
              - after: handler.validate_state_transition(from_state = IfcImportProcessState.UNDEFINED, to_state = IfcImportProcessState.DXF_SOURCE_READY)

      - name: dxf_source_ready
        transitions:
          - target: representation_kind_defined
            guard: handler.can_transit_to(to_state = IfcImportProcessState.REPRESENTATION_KIND_DEFINED)
            action: handler.perform_state_transition(to_state = IfcImportProcessState.REPRESENTATION_KIND_DEFINED)
            contract:
              - after: handler.validate_state_transition(from_state = IfcImportProcessState.DXF_SOURCE_READY, to_state = IfcImportProcessState.REPRESENTATION_KIND_DEFINED)

      - name: representation_kind_defined
        transitions:
          - target: dxf_geometry_read
            guard: handler.can_transit_to(to_state = IfcImportProcessState.DXF_GEOMETRY_READ)
            action: handler.perform_state_transition(to_state = IfcImportProcessState.DXF_GEOMETRY_READ)
            contract:
              - after: handler.validate_state_transition(from_state = IfcImportProcessState.REPRESENTATION_KIND_DEFINED, to_state = IfcImportProcessState.DXF_GEOMETRY_READ)

      - name: dxf_geometry_read
        transitions:
          - target: import_ready
            guard: handler.can_transit_to(to_state = IfcImportProcessState.IMPORT_READY)
            action: handler.perform_state_transition(to_state = IfcImportProcessState.IMPORT_READY)
            contract:
              - after: handler.validate_state_transition(from_state = IfcImportProcessState.DXF_GEOMETRY_READ, to_state = IfcImportProcessState.IMPORT_READY)

      - name: import_ready
        type: final
